name: 💡 功能建议
description: 提出新功能或改进想法
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ⚠️ **先看一下本仓库的定位**：这是上游的 fork，**只做 DSH 内核适配**，
        不改上游的协议/鉴权/计费逻辑。
        如果你的建议涉及那些部分，请提到[上游仓库](https://github.com/liudapeng0311/dsh-raccoon-work)。

  - type: dropdown
    id: scope
    attributes:
      label: 你的建议属于哪一类？
      options:
        - DSH 内核适配 / 兼容性
        - 文档改进
        - 测试补充
        - 其他（需要讨论）
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题？
      description: 描述痛点，而不是直接给方案——这样更容易找到更好的解法
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的方案
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案
    validations:
      required: false
