name: 🐛 Bug 报告
description: 插件行为不符合预期 / 装载失败 / 报错
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！本插件强依赖 DSH 内核版本，**请务必填写下面两项版本号**，
        否则很难定位问题。

  - type: input
    id: dsh-version
    attributes:
      label: DSH 内核版本
      description: 在 DSH 所在环境执行 `dsh --version` 的输出
      placeholder: 例如 0.2.1-rc.2
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: 插件版本
      description: 在 DSH 里看插件卡片，或查 `$DSH_HOME/profiles/<profile>/package.json`
      placeholder: 例如 0.2.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 实际发生了什么？
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 你认为应该发生什么？
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 越具体越好（含点击路径、命令）
      placeholder: |
        1. 打开 DSH 设置 → 插件
        2. ...
        3. 看到报错 ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 相关日志 / 截图
      description: |
        插件心跳文件（`$DSH_HOME/.raccoon-host-heartbeat.json`）、
        DSH 控制台输出、错误截图。
        **请先删除其中的 token、邮箱、本机用户名等信息。**
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已确认**小浣熊桌面 App 处于登录状态**（插件复用它的登录态）
          required: true
        - label: 我已在 [README 的常见问题](https://github.com/zhlcba/dsh-raccoon-connect#常见问题) 里找过
          required: true
        - label: 我提交的内容里**不含任何凭据**
          required: true
