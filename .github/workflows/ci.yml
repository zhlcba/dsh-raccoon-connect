name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    name: 类型检查 · 测试 · 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # 本项目的 peerDependencies 是版本区间（>=0.2.1-rc.1 <0.3），
      # npm 严格解析容易因可选 peer 报错，用 legacy 模式安装。
      - name: Install
        run: npm ci --legacy-peer-deps

      # 用镜像装过依赖的话，lock 里会留下镜像地址；较新的 npm 会以
      # EALLOWREMOTE「Refusing to fetch ... remote」直接拒绝安装。
      - name: 检查 package-lock 只引用官方源
        run: |
          if grep -nE 'npmmirror|registry\.yarnpkg|cdn\.' package-lock.json; then
            echo "::error::package-lock.json 含非官方源地址——请在官方源下重装依赖后提交 lock"
            exit 1
          fi
          echo "lock 只引用官方源 ✅"

      - name: Type check (host)
        run: npx tsc -p tsconfig.json --noEmit

      - name: Type check (client)
        run: npx tsc -p tsconfig.client.json --noEmit

      - name: Tests
        run: npx vitest run

      - name: Build
        run: npx tsdown

      # 防止「改了 src 忘了提交 lib/」——DSH 的 github: 安装源不跑 prepack，
      # lib/ 不入库的话别人装完就是坏的。
      #
      # core.fileMode=false：lib/bin.js 带 shebang，Linux 构建可能给它加执行位
      # （Windows 无此概念，本地永远复现不了），那只是权限差异，不是内容差异。
      - name: 检查 lib/ 是否与源码同步
        run: |
          git -c core.fileMode=false status --porcelain lib/ > /tmp/lib_diff.txt
          if [ -s /tmp/lib_diff.txt ]; then
            echo "::error::lib/ 与构建结果不一致——请本地跑 npx tsdown 后把 lib/ 一起提交"
            echo "----- 差异明细 -----"
            cat /tmp/lib_diff.txt
            echo "----- git diff -----"
            git -c core.fileMode=false diff --stat lib/ || true
            exit 1
          fi
          echo "lib/ 已同步 ✅"
