name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    name: 类型检查 · 测试 · 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # 本项目的 peerDependencies 是版本区间（>=0.2.1-rc.1 <0.3），
      # npm 严格解析容易因可选 peer 报错，用 legacy 模式安装。
      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Type check (host)
        run: npx tsc -p tsconfig.json --noEmit

      - name: Type check (client)
        run: npx tsc -p tsconfig.client.json --noEmit

      - name: Tests
        run: npx vitest run

      - name: Build
        run: npx tsdown

      # 防止「改了 src 忘了提交 lib/」——DSH 的 github: 安装源不跑 prepack，
      # lib/ 不入库的话别人装完就是坏的。
      - name: 检查 lib/ 是否与源码同步
        run: |
          if [ -n "$(git status --porcelain lib/)" ]; then
            echo "::error::lib/ 与构建结果不一致——请本地跑 npx tsdown 后把 lib/ 一起提交"
            git status --porcelain lib/
            exit 1
          fi
          echo "lib/ 已同步 ✅"
